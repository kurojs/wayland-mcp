[project]
name = "wayland-mcp-kurojs"
version = "0.5.0"
description = "Model Context Protocol server for Wayland desktop automation with VLM analysis, mouse/keyboard control, and action chaining"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "kurojs" }]
maintainers = [{ name = "kurojs" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "wayland",
    "desktop-automation",
    "ai-assistant",
    "vlm",
    "computer-use",
    "screenshot",
    "mouse-control",
    "keyboard-automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "fastmcp>=0.1.0",
    "Pillow>=10.0.0"
]
requires-python = ">=3.8"

[project.optional-dependencies]
# PyGObject drives the XDG portals, which is how capture and input work without
# any privilege. It is a system package on most distributions (python3-gi on
# Debian/Ubuntu/Pop!_OS, python-gobject on Arch, python3-gobject on Fedora); pip
# can build it too, given the GObject development headers. The server imports and
# runs without it -- it just falls back to whatever command-line tools exist.
portal = ["PyGObject>=3.42"]
dev = ["pytest>=7.0"]

[project.urls]
repository = "https://github.com/kurojs/wayland-mcp"
homepage = "https://github.com/kurojs/wayland-mcp"
documentation = "https://github.com/kurojs/wayland-mcp#readme"
changelog = "https://github.com/kurojs/wayland-mcp/releases"

[project.scripts]
wayland-mcp-kurojs = "wayland_mcp.server_mcp:main"
wayland-mcp = "wayland_mcp.server_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["wayland_mcp"]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"